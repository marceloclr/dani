name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # carimbo da versão (DDMMAAAA-HHMM, Fortaleza): o mesmo no topo do app e no nome index-<carimbo>.html
      - run: echo "VERSAO_PUBLICADA=$(TZ=America/Fortaleza date +%d%m%Y-%H%M)" >> "$GITHUB_ENV"
      - run: npm run build
        env:
          BASE: /dani/
      # só a atual é index.html; as duas anteriores continuam no ar como index-DDMMAAAA-HHMM.html
      - run: node tools/versoes-anteriores.mjs https://marceloclr.github.io/dani/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
